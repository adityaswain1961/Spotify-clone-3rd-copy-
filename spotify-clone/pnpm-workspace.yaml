# Backend workspace only. The Expo app in mobile-app/ is a standalone npm project
# (Metro + Expo Go are most reliable with a flat node_modules).
packages:
  - apps/*
  - libs/*

autoInstallPeers: true

onlyBuiltDependencies:
  - esbuild
  - bcrypt
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - nx
  - ffmpeg-static
  - msgpackr-extract
  - protobufjs
  - '@nestjs/core'
  - '@swc/core'
