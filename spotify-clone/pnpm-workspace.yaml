onlyBuiltDependencies:
  - esbuild
  - bcrypt
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - nx
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: set this to true or false
  ffmpeg-static: true
  msgpackr-extract: true
  nx: true
  prisma: true
  protobufjs: true
autoInstallPeers: true
packages:
  - apps/*
  - libs/*
  - mobile-app
